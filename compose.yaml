services:
  db:
    image: postgres:17.11-bookworm
    command: ["postgres", "-p", "${DB_PORT:?Set DB_PORT in apps/api/.env}"]
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in apps/api/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in apps/api/.env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in apps/api/.env}
    ports:
      - "127.0.0.1:${DB_PORT:?Set DB_PORT in apps/api/.env}:${DB_PORT:?Set DB_PORT in apps/api/.env}"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?} -d ${DB_NAME:?} -p ${DB_PORT:?}"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-test:
    image: postgres:17.11-bookworm
    profiles: [test]
    environment:
      POSTGRES_USER: ${TEST_DB_USER:?Set TEST_DB_USER in apps/api/.env}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in apps/api/.env}
      POSTGRES_DB: ${TEST_DB_NAME:?Set TEST_DB_NAME in apps/api/.env}
    volumes:
      - db_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:?} -d ${TEST_DB_NAME:?}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
    env_file:
      - path: ./apps/api/.env.example
      - path: ./apps/api/.env
        required: false
    environment:
      PORT: "3000"
      LISTEN_HOST: 0.0.0.0
      DB_PORT: ${DB_PORT:?Set DB_PORT in apps/api/.env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/apps/api/node_modules
      - api_dist:/app/apps/api/dist
      - api_test_build:/app/apps/api/.test-build
    command: sh -c "npm run build && exec node --env-file-if-exists=.env dist/main.js"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', { signal: AbortSignal.timeout(2000) }).then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  dispatcher:
    profiles: [sync]
    build:
      context: ./apps/api
    env_file:
      - path: ./apps/api/.env.example
      - path: ./apps/api/.env
        required: false
    environment:
      DB_PORT: ${DB_PORT:?Set DB_PORT in apps/api/.env}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/sync/dispatch/run-dispatcher.js"]
    stop_grace_period: 30s

  worker:
    profiles: [sync]
    build:
      context: ./apps/api
    env_file:
      - path: ./apps/api/.env.example
      - path: ./apps/api/.env
        required: false
    environment:
      DB_PORT: ${DB_PORT:?Set DB_PORT in apps/api/.env}
    depends_on:
      db:
        condition: service_healthy
      sync-mock:
        condition: service_healthy
    command: ["node", "dist/sync/worker/run-worker.js"]
    stop_grace_period: 30s

  sync-mock:
    profiles: [sync]
    build:
      context: ./apps/api
    env_file:
      - path: ./apps/api/.env.example
      - path: ./apps/api/.env
        required: false
    environment:
      DB_PORT: ${DB_PORT:?Set DB_PORT in apps/api/.env}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/sync/mock/run-mock-sync.js"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health', { signal: AbortSignal.timeout(2000) }).then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  api_node_modules:
  api_dist:
  api_test_build:
  db_data:
  db_test_data:
