services:
  api:
    build:
      context: ./apps/api
    env_file:
      - path: ./apps/api/.env.example
      - path: ./apps/api/.env
        required: false
    environment:
      PORT: "3000"
      LISTEN_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/apps/api/node_modules
      - api_dist:/app/apps/api/dist
      - api_test_build:/app/apps/api/.test-build
    command: sh -c "npm run build && exec node --env-file-if-exists=.env dist/main.js"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', { signal: AbortSignal.timeout(2000) }).then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  api_node_modules:
  api_dist:
  api_test_build:
